name: Build és tesztek

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fordítás és tesztek
        run: ./build.sh test
      - name: JAR feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: sporolos-konyha
          path: target/sporolos-konyha.jar
